name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Vite bundle
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          html="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$PAGE_URL")"
          asset_path="$(printf '%s' "$html" | grep -oE 'src="[^"]+\.js"' | head -n 1 | cut -d '"' -f 2)"
          if [ -z "$asset_path" ] || [[ "$asset_path" == /src/* ]]; then
            echo "GitHub Pages is serving source HTML instead of the Vite build."
            exit 1
          fi
          asset_url="$(python -c 'from urllib.parse import urljoin; import sys; print(urljoin(sys.argv[1], sys.argv[2]))' "$PAGE_URL" "$asset_path")"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$asset_url" >/dev/null
